<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake – Rezepte-Spiele</title>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="Rezepte-Spiele">
  <meta property="og:title" content="Snake – Rezepte-Spiele">
  <meta property="og:description" content="Snake: Äpfel fressen und Coins sammeln.">
  <meta property="og:url" content="https://redcommand99779.github.io/rezeptegames/spiele/snake.html">
  <meta property="og:image" content="https://redcommand99779.github.io/rezeptegames/bilder/vorschau.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Koch &amp; Back Mini Games">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="seite">
    <header class="kopf">
      <a class="zurueck" href="../index.html">← Alle Spiele</a>
      <div class="coins"><span class="coin-symbol"></span><strong data-coins>0</strong> Coins</div>
    </header>

    <h1>Snake</h1>
    <div class="statuszeile">
      <span>Äpfel: <strong id="aepfel">0</strong></span>
      <span>Bestwert: <strong id="best">0</strong></span>
      <button type="button" class="button" id="start">Start</button>
    </div>
    <p class="meldung" id="meldung" role="status"></p>
    <canvas class="snake-leinwand spielfeld" id="leinwand" width="320" height="320" aria-label="Spielfeld"></canvas>

    <div class="steuerkreuz" aria-label="Steuerung">
      <button type="button" class="oben" data-richtung="oben" aria-label="Hoch">▲</button>
      <button type="button" class="links" data-richtung="links" aria-label="Links">◀</button>
      <button type="button" class="unten" data-richtung="unten" aria-label="Runter">▼</button>
      <button type="button" class="rechts" data-richtung="rechts" aria-label="Rechts">▶</button>
    </div>
  </div>

  <script src="../coins.js"></script>
  <script src="../stats.js"></script>
  <script src="snake.js"></script>
</body>
</html>
